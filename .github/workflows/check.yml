name: Proxy Checker Schedule

on:
  schedule:
    - cron: '0 */4 * * *'  # Запуск каждые 4 часа
  workflow_dispatch:        # Кнопка ручного запуска

permissions:
  contents: write           # Права на push обновленных данных

jobs:
  run-checker:
    runs-on: ubuntu-latest

    steps:
      - name: Чтение репозитория (Checkout)
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml pysocks

      - name: Скачивание и распаковка Xray Core (v26.3.27)
        run: |
          curl -L -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip"
          unzip -o xray.zip
          chmod +x xray

      - name: Запуск проверки прокси
        run: python -u parsergithub.py

      - name: Коммит и Пуш результатов в репозиторий
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          for f in good_proxies.txt sub.txt clash.yaml clash_top100.yaml top100.txt top100_sub.txt clash_top500.yaml top500_sub.txt top500.txt; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || (git commit -m "Auto-update proxies [skip ci]" && git push)
